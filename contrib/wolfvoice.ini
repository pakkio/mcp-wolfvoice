; wolfvoice — WebRTC voice for an OpenSimulator region.
;
; Install as:  <region>/bin/config/wolfvoice.ini
;
; bin/config/ is deliberate: OpenSim reads every .ini in that directory AFTER
; OpenSim.ini and treats them as overrides (OpenSim/Region/Application/
; ConfigurationLoader.cs, "Override distro settings with contents of inidirectory",
; default inidirectory = "config"). Two useful consequences:
;   * a shared/templated OpenSim.ini can be re-copied without clobbering this, and
;   * with one OpenSim process per region, only that region is affected.
;
; If instead you run many regions in ONE simulator process, this enables WebRTC
; voice for ALL regions in that process — [WebRtcVoice] Enabled is read once per
; process, not per region.
;
; PREREQUISITES — see docs/OPENSIM.md:
;   1. The os-webrtc-janus addon must be BUILT INTO your OpenSim (it supplies
;      WebRtcVoice.dll). You do NOT need Janus itself — we use only its
;      JSON-RPC connector, which will post to any URL.
;   2. Voice must be allowed on the ESTATE and on the PARCEL, or the viewer never
;      even asks for voice. This is the single most common reason for "it does
;      nothing": About Land -> Sound -> Allow Voice Chat.

[WebRtcVoice]
    Enabled = true

    ; Send both spatial and non-spatial voice to wolfvoice. This connector is a
    ; plain JSON-RPC 2.0 client and does not care that the far end is Rust rather
    ; than another OpenSim — which is why no Janus is involved.
    SpatialVoiceService = WebRtcVoice.dll:WebRtcVoiceServiceConnector
    NonSpatialVoiceService = WebRtcVoice.dll:WebRtcVoiceServiceConnector

    ; Your wolfvoice server. USE HTTPS with a certificate that .NET will trust
    ; (a normal Let's Encrypt cert is fine). The SDP carries the server's DTLS
    ; fingerprint, so an attacker who can rewrite plaintext signalling in flight
    ; could substitute their own and become the media endpoint.
    WebRtcVoiceServerURI = https://voice.example.org:9443

    ; Verbose: logs entire SDP bodies. Useful on ONE region while diagnosing,
    ; wasteful across a fleet.
    MessageDetails = false

[VivoxVoice]
    ; Turn Vivox off wherever WebRTC is on. Both modules register the SAME
    ; capability name and the LAST registration wins, so leaving both enabled is a
    ; race rather than a choice.
    enabled = false
